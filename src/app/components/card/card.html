<div class="bg-red-900 w-1/2 h-auto rounded-lg shadow-md p-4">

<div class="">
    <div class="h-10 w-10">
        <img [src]="cardInfo().imageURL" [alt]="cardInfo().title" />
    </div>
    <div>
        <h1>{{cardInfo().title}}</h1>
        <body>{{cardInfo().body_text}}</body>
        <span> @for (item of cardInfo().links; track $index) {
            <a [href]="item.link" target="_blank">{{item.linkText}}</a>
        }</span>
    </div>
</div>

</div>
